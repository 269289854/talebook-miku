name: Code Quality Check and Build

on:
  push:
    branches:
      - main
      - dev
      - dev-*
  pull_request:
    branches:
      - main

jobs:
  check-design:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate internal design documents
        run: make check-design

  test-server:
    runs-on: ubuntu-latest
    container:
      # 与 Dockerfile 使用同一个固定版本，由 mirror-base-image.yml 同步到本仓库所有者的 GHCR。
      image: ghcr.io/${{ github.repository_owner }}/talebook-base:slim-v8.5.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root

    steps:
      - name: Install git (required for submodule checkout in container)
        run: |
          if ! command -v git >/dev/null 2>&1 || [ "$(git --version | awk '{print $3}' | cut -d. -f1,2)" \< "2.18" ]; then
            apt-get update
            apt-get install -y --no-install-recommends git ca-certificates
            rm -rf /var/lib/apt/lists/*
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Inspect environment
        run: |
          command -v ebook-convert
          ebook-convert --version
          command -v calibredb
          calibredb --version
          command -v make
          make --version
          python3 --version
          pip3 --version

      - name: Install Python dependencies
        run: make init

      - name: Lint with ruff
        run: make lint-py

      - name: Run tests with pytest
        run: make pytest

  test-ui:
    runs-on: ubuntu-latest
    container:
      image: node:20-alpine

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          cd app
          npm ci

      - name: Run linting
        run: |
          cd app
          npm run lint

      - name: Nuxt build
        run: |
          cd app
          npm run build

      - name: Generate build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nuxt-build
          path: app/.nuxt
          retention-days: 1

  integration-test:
    runs-on: ubuntu-latest
    needs: [check-design, test-server, test-ui]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: All tests passed
        run: |
          echo "✅ All tests completed successfully"
          echo "Server tests: ✓"
          echo "UI tests: ✓"
