name: Mirror Base Image

# 上游 talebook/talebook-base 维护 Calibre 运行时基础镜像。为避免构建直接依赖上游，
# 把固定版本连同全部架构复制到本仓库所有者的 GHCR，Dockerfile 与 CI 只从这里拉取。
# 升级基础镜像：修改下方 BASE_IMAGE_TAG 并推送（或手动触发），
# 再把 Dockerfile 与 .github/workflows/ci.yml 指向新 tag。
on:
  push:
    paths:
      - .github/workflows/mirror-base-image.yml
  workflow_dispatch:

env:
  SOURCE_IMAGE: docker.io/talebook/talebook-base
  BASE_IMAGE_TAG: slim-v8.5.0

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy all platforms to GHCR
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          TARGET="ghcr.io/${OWNER,,}/talebook-base:${BASE_IMAGE_TAG}"
          docker buildx imagetools create --tag "$TARGET" "${SOURCE_IMAGE}:${BASE_IMAGE_TAG}"
          docker buildx imagetools inspect "$TARGET"
